[tool.poetry]
package-mode = false

[project]
name = "sped-fiscal"
version = "0.1.0"
description = "Automação SPED Fiscal EFD ICMS/IPI"
authors = [
    {name = "rodrigo.resque",email = "rodrigo.resque@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "streamlit>=1.30.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.0",
    "xlsxwriter>=3.0.0",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
app = "app:main"